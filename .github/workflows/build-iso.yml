name: Build and boot-test Kinetix ISO

on:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths:
      - "auto/**"
      - "config/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/build-iso.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "auto/**"
      - "config/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/build-iso.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-boot:
    name: Build ISO and boot it in QEMU
    runs-on: ubuntu-latest
    timeout-minutes: 100
    container:
      image: debian:trixie
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install build and verification tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            live-build debootstrap xorriso squashfs-tools \
            qemu-system-x86 qemu-utils socat procps python3-pil tesseract-ocr \
            ca-certificates

      - name: Build bootable hybrid ISO
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p dist
          ./scripts/build-iso.sh 2>&1 | tee dist/iso-build.log
          ISO="$(find . -maxdepth 2 -type f -name '*.iso' -not -path './dist/*' -print -quit)"
          if [[ -z "$ISO" ]]; then
            echo "::error::live-build completed but no ISO was produced."
            exit 1
          fi
          cp "$ISO" dist/Kinetix-OS-amd64.iso
          test "$(stat -c %s dist/Kinetix-OS-amd64.iso)" -gt 104857600
          sha256sum dist/Kinetix-OS-amd64.iso > dist/SHA256SUMS
          file dist/Kinetix-OS-amd64.iso | tee dist/iso-file-type.txt

      - name: Verify ISO boot catalog and boot Debian Live in QEMU
        run: bash scripts/verify-iso.sh dist/Kinetix-OS-amd64.iso

      - name: Upload ISO and boot-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kinetix-iso-${{ github.run_number }}
          path: dist/
          if-no-files-found: warn
          retention-days: 14

  publish-release:
    name: Publish tagged ISO release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-boot
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: kinetix-iso-${{ github.run_number }}
          path: dist/

      - name: Publish ISO and checksum
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Kinetix-OS-amd64.iso
            dist/SHA256SUMS
