name: Validate Kinetix OS

on:
  push:
    branches: ["main"]
    paths:
      - "config/**"
      - "auto/config"
      - "scripts/**"
      - "index.html"
      - ".github/workflows/validate-live-build.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "config/**"
      - "auto/config"
      - "scripts/**"
      - "index.html"
      - ".github/workflows/validate-live-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-packages:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v7

      - name: Enable contrib and non-free repositories
        run: |
          set -eu
          if ls /etc/apt/sources.list.d/*.sources >/dev/null 2>&1; then
            sed -i 's/^Components: main$/Components: main contrib non-free non-free-firmware/' /etc/apt/sources.list.d/*.sources
          fi
          if [ -f /etc/apt/sources.list ]; then
            sed -i -E 's/^(deb(-src)? [^ ]+ [^ ]+ main)$/\\1 contrib non-free non-free-firmware/' /etc/apt/sources.list
          fi
          apt-get update

      - name: Collect package names
        run: |
          set -eu
          grep -hv '^[[:space:]]*#' config/package-lists/*.chroot | grep -v '^[[:space:]]*$' > /tmp/packages.txt
          grep -E '^[[:space:]]*-[[:space:]]+[A-Za-z0-9]' config/app-bundles.yaml \\
            | sed -E 's/^[[:space:]]*-[[:space:]]*//' >> /tmp/packages.txt
          sort -u -o /tmp/packages.txt /tmp/packages.txt
          echo "Checking $(wc -l < /tmp/packages.txt) package names."

      - name: Verify package availability
        run: |
          set -eu
          missing=0
          while IFS= read -r package; do
            [ -n "$package" ] || continue
            if ! apt-cache show "$package" >/dev/null 2>&1; then
              echo "::error::Package not found in Debian trixie: $package"
              missing=1
            fi
          done < /tmp/packages.txt
          exit "$missing"

  validate-build-configuration:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v7
      - name: Install live-build
        run: |
          apt-get update
          apt-get install -y --no-install-recommends live-build
      - name: Validate live-build configuration
        run: sh auto/config

  validate-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check shell syntax and mirrored first-login scripts
        run: |
          set -eu
          sh -n auto/config
          sh -n scripts/build-iso.sh
          bash -n scripts/kinetix-firstboot.sh
          bash -n config/includes.chroot/usr/local/bin/kinetix-firstboot.sh
          cmp scripts/kinetix-firstboot.sh config/includes.chroot/usr/local/bin/kinetix-firstboot.sh
          git diff --check
