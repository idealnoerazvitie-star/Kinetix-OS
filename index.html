overflow:auto;padding:0 22px 18px}.section-title{font-size:12px;font-weight:750;text-transform:uppercase;letter-spacing:.08em;color:#7a8eaa;margin:10px 0}.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.quick{border:1px solid var(--line);border-radius:14px;background:#fff;padding:13px;text-align:left;min-height:88px}.quick:hover,.appcard:hover{border-color:#9fc9fa;box-shadow:0 6px 18px #3d77ad12}.quick i{font-style:normal;font-size:23px}.quick b,.quick small{display:block}.quick small{color:var(--muted);margin-top:3px}.store-toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:16px 0 10px}.tabs{display:flex;gap:5px;overflow:auto}.tab{white-space:nowrap;border:0;background:transparent;padding:7px 10px;border-radius:9px;color:#7183a3;font-size:12px}.tab.active{background:#e8f2ff;color:#1768cf;font-weight:700}.app-count{font-size:12px;color:#8a9ab1;white-space:nowrap}.apps-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.appcard{display:flex;gap:11px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;min-width:0}.appicon{width:39px;height:39px;flex:none;border-radius:11px;background:linear-gradient(145deg,#eff6ff,#e2f0ff);display:grid;place-items:center;font-size:21px}.appinfo{min-width:0;flex:1}.appinfo b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.appinfo small{color:#8495ad;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.app-action{border:0;border-radius:8px;padding:6px 9px;background:#eaf3ff;color:#2475d8;font-size:11px;font-weight:700}.app-action.installed{background:#eaf8f1;color:#248754}.start-footer{border-top:1px solid var(--line);padding:11px 20px;display:flex;justify-content:space-between;color:#7183a3}.start-footer button{border:0;background:transparent;color:inherit}.window{position:absolute;z-index:7;left:50%;top:50%;transform:translate(-50%,-50%);width:min(770px,calc(100vw - 32px));height:min(540px,calc(100vh - 140px));display:none;grid-template-rows:43px 1fr;background:#fff;border:1px solid #fff;border-radius:16px;box-shadow:0 25px 80px #173a6435;overflow:hidden}.window.open{display:grid}.winbar{height:43px;background:#f8faff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 13px}.wintitle{font-weight:700;display:flex;gap:8px;align-items:center}.wincontrols{display:flex;gap:7px}.wincontrols button{width:23px;height:23px;border:0;border-radius:7px;background:#eaf1fa}.wincontrols button:last-child{background:#fee9ed;color:#c64259}.winbody{overflow:auto;padding:20px}.welcome{background:linear-gradient(120deg,#edf6ff,#fff);padding:22px;border-radius:15px;border:1px solid #e6f0fc}.welcome h2{margin:0 0 5px;font-size:24px}.welcome p{color:var(--muted);margin:0}.statrow{display:flex;gap:10px;margin-top:17px}.stat{flex:1;padding:13px;border:1px solid var(--line);border-radius:12px;background:#fff}.stat b{display:block;font-size:20px;color:#2475d8}.stat small{color:var(--muted)}.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px;margin-top:17px}.file{border:1px solid var(--line);border-radius:12px;padding:13px;text-align:center;cursor:pointer}.file:hover{background:#f3f8ff}.file span{display:block;font-size:28px}.notes{width:100%;height:330px;border:1px solid var(--line);border-radius:12px;padding:14px;resize:vertical;outline-color:#80b8fa}.calc{max-width:330px}.calc-display{width:100%;height:62px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:10px;text-align:right;font-size:26px}.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.calc-grid button{border:0;border-radius:10px;padding:14px;background:#f1f6fc;font-weight:650}.calc-grid button:hover{background:#e1efff}.settings-list{display:grid;gap:9px}.setting{display:flex;justify-content:space-between;align-items:center;padding:14px;border:1px solid var(--line);border-radius:12px}.setting input[type=range]{accent-color:#2878e8}.terminal{background:#102037;color:#d9e8ff;border-radius:12px;padding:16px;font:13px/1.6 ui-monospace,monospace;min-height:300px}.terminal input{background:transparent;border:0;color:#fff;outline:0;font:inherit;width:75%}.toast{position:absolute;z-index:20;right:20px;top:55px;background:#183353;color:#fff;padding:11px 16px;border-radius:11px;box-shadow:var(--shadow);opacity:0;transform:translateY(-8px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:none}.mobile-hint{display:none}@media(max-width:600px){.topright{gap:5px}.topright .hide-mobile{display:none}.desktop-icons{top:55px;left:8px;gap:5px}.wallpaper-copy{right:7vw;top:25vh}.wallpaper-copy p{font-size:13px}.quick-grid{grid-template-columns:repeat(2,1fr)}.apps-grid{grid-template-columns:1fr}.start{height:min(680px,calc(100vh - 125px));bottom:82px}.dock{bottom:9px}.dock button{width:41px;height:43px}.statrow{flex-wrap:wrap}.stat{min-width:40%}}
</style></head>
<body><main id="desktop"><header class="topbar"><div class="brand-mini"><span class="logo">Q</span> Quantix OS <span style="font-weight:400;color:#8294ad">· Desktop</span></div><div class="topright"><button class="topbutton hide-mobile" onclick="notify('Network: connected · Wi-Fi')">◉ <span>Online</span></button><button class="topbutton hide-mobile" onclick="notify('Battery: plugged in')">▰ 100%</button><button class="topbutton" onclick="openApp('settings')">⚙</button><span class="clock" id="clock"></span></div></header>
<div class="desktop-icons"><button class="deskicon" onclick="openApp('files')"><span class="emoji">📁</span>Home</button><button class="deskicon" onclick="openApp('store')"><span class="emoji">🛍️</span>App Store</button><button class="deskicon" onclick="openApp('welcome')"><span class="emoji">💠</span>About Quantix</button></div>
<div class="wallpaper-copy"><div class="eyebrow">A desktop built around you</div><h1>Quantix</h1><p>Open, versatile, and ready for what’s next.</p></div>
<div class="dock"><button title="Applications" onclick="toggleStart()">🔷</button><button title="Files" onclick="openApp('files')">📁</button><button title="Web browser" onclick="openApp('browser')">🌐</button><button title="Notes" onclick="openApp('notes')">📝</button><button title="App Store" onclick="openApp('store')">🛍️</button><span class="separator"></span><button title="Settings" onclick="openApp('settings')">⚙️</button><button title="Terminal" onclick="openApp('terminal')">⌨️</button></div>
<section class="start" id="start"><div class="start-head"><h2>Applications</h2><div class="profile"><span>Quantix User</span><span class="avatar">Q</span></div></div><div class="search"><span>⌕</span><input id="search" placeholder="Search apps, categories…" oninput="renderApps()"></div><div class="store-content"><div class="section-title">Pinned</div><div class="quick-grid"><button class="quick" onclick="openApp('browser')"><i>🌐</i><b>Web Browser</b><small>Explore the web</small></button><button class="quick" onclick="openApp('files')"><i>📁</i><b>Files</b><small>Browse your files</small></button><button class="quick" onclick="openApp('notes')"><i>📝</i><b>Notes</b><small>Write something</small></button><button class="quick" onclick="openApp('store')"><i>🛍️</i><b>Quantix Store</b><small>Discover software</small></button></div><div class="store-toolbar"><div class="tabs" id="tabs"></div><span class="app-count" id="app-count"></span></div><div class="apps-grid" id="apps-grid"></div></div><footer class="start-footer"><span>Quantix OS · Preview</span><button onclick="notify('Power controls are a desktop preview feature.')">⏻ Power</button></footer></section>
<section class="window" id="window"><header class="winbar"><div class="wintitle"><span id="win-icon">💠</span><span id="win-title">Welcome</span></div><div class="wincontrols"><button onclick="minimizeWindow()">−</button><button onclick="maximizeWindow()">□</button><button onclick="closeWindow()">×</button></div></header><div class="winbody" id="winbody"></div></section><div class="toast" id="toast"></div></main>
<script>
const groups={
'Internet & communication':['Firefox','Chromium','Brave Browser','Thunderbird','Element','Signal Desktop','Telegram','qBittorrent','Transmission','FileZilla','Remmina','Syncthing','Jitsi Meet','KMail','Kdenlive PeerTube','Mullvad Browser','Konqueror','HexChat','Deluge','Liferea'],
'Office & productivity':['LibreOffice Writer','LibreOffice Calc','LibreOffice Impress','OnlyOffice Desktop','Calligra Suite','Okular','Evince','Zotero','Joplin','Obsidian','KeePassXC','Bitwarden','Calendar','KOrganizer','GnuCash','ProjectLibre','AbiWord','PDF Arranger','Xournal++','HomeBank'],
'Graphics & photography':['GIMP','Inkscape','Krita','Blender','Darktable','RawTherapee','Shotwell',' digiKam','Pinta','MyPaint','Scribus','FreeCAD','Sweet Home 3D','Pencil2D','Synfig Studio','Graphviz','Figma Linux','KolourPaint','ImageMagick','Kdenlive'],
'Audio & video':['VLC','MPV','Audacity','OBS Studio','HandBrake','Shotcut','Ardour','LMMS','MuseScore','Rhythmbox','Lollypop','Celluloid','K3b','Easy Effects','Pitivi','Olive Video Editor','Kdenlive Editor','SMPlayer','Mixxx','Subtitle Composer'],
'Development':['Visual Studio Code','VSCodium','Geany','Kate','Neovim','Emacs','Qt Creator','Eclipse IDE','IntelliJ IDEA Community','PyCharm Community','GitKraken','Gitg','Git Cola','Meld','Docker Desktop','Podman Desktop','DBeaver','SQLite Browser','Postman','Insomnia'],
'Science & education':['stellarium','KStars','Celestia','Marble','GNU Octave','RStudio','JupyterLab','KiCad','Fritzing','Arduino IDE','Scratch','GCompris','KAlgebra','GeoGebra','Anki','GoldenDict','OpenBoard','Tux Paint','Step','LabPlot'],
'Games':['Steam','Lutris','Heroic Games Launcher','Minetest','0 A.D.','SuperTuxKart','Warzone 2100','OpenTTD','Battle for Wesnoth','0ad Editor','RetroArch','Dolphin Emulator','PCSX2','PPSSPP','ScummVM','SuperTux','Frozen Bubble','Hedgewars','Xonotic','Neverball'],
'System & utilities':['Timeshift','KDE Connect','BleachBit','GParted','Baobab Disk Usage','Stacer','CPU-X','HardInfo','KSysGuard','Htop','Fastfetch','GParted Live Tools','Flatseal','USBImager','Popsicle','Etcher','P7zip','PeaZip','File Roller','Kup Backup'],
'Security & privacy':['ClamTk','KeePassXC Browser','VeraCrypt','Gufw Firewall','OpenVPN','WireGuard','Tor Browser','OnionShare','Metadata Cleaner','Seahorse','Nitrokey App','YubiKey Manager','Firejail','Lynis','rkhunter','Chkrootkit','Bitwarden Desktop','Proton VPN','OpenSnitch','Safing Portmaster'],
'Raspberry Pi & maker':['Raspberry Pi Imager','Thonny','GPIO Zero','Scratch 3','Sense HAT Emulator','RPi.GPIO Tools','PiKISS','Pi-Apps','Pico SDK','Arduino IDE for Pi','WiringPi Tools','Kodi','OctoPrint','Home Assistant','Node-RED','Mosquitto MQTT','OpenSCAD','FreeCAD','Fritzing','KiCad'],
'Accessibility & desktop':['Orca Screen Reader','Onboard Keyboard','Magnifier','Speech Dispatcher','KMag','KMouseTool','KColorChooser','KCharSelect','Night Light','Redshift','KDE System Settings','GNOME Tweaks','LXAppearance','Font Manager','Variety Wallpaper','Albert Launcher','Dolphin File Manager','Thunar','Nemo','KRunner']};
const icons=['🌐','📧','💬','🗂️','📄','📊','🔐','🎨','🖌️','🧊','🎬','🎧','🎙️','💻','🧰','🧪','📐','🎓','🎮','🕹️','⚙️','🛠️','💾','🔒','🛡️','🍓','🤖','🔌','♿','🖥️'];
const catalog=Object.entries(groups).flatMap(([category,names],ci)=>names.map((name,i)=>({name:name.trim(),category,icon:icons[(ci*4+i)%icons.length],description:`${category} software`,source:'Community repositories'})));
let activeCategory='All';const builtins=['welcome','store','files','notes','settings','terminal','browser'];let installed=new Set(JSON.parse(localStorage.getItem('quantix-installed')||'[]'));let current='';
function toggleStart(){document.getElementById('start').classList.toggle('open');renderApps();setTimeout(()=>document.getElementById('search').focus(),80)}
function renderApps(){const q=(document.getElementById('search').value||'').toLowerCase();const cats=['All',...Object.keys(groups)];document.getElementById('tabs').innerHTML=cats.map(c=>`<button class="tab ${activeCategory===c?'active':''}" onclick="activeCategory='${c.replaceAll("'","\\'")}';renderApps()">${c}</button>`).join('');let list=catalog.filter(a=>(activeCategory==='All'||a.category===activeCategory)&&(!q||`${a.name} ${a.category}`.toLowerCase().includes(q)));document.getElementById('app-count').textContent=`${list.length} apps · ${catalog.length} total`;document.getElementById('apps-grid').innerHTML=list.map(a=>`<article class="appcard" onclick="appDetails('${a.name.replaceAll("'","\\'")}')"><span class="appicon">${a.icon}</span><span class="appinfo"><b>${a.name}</b><small>${a.category}</small></span><button class="app-action ${installed.has(a.name)?'installed':''}" onclick="event.stopPropagation();installApp('${a.name.replaceAll("'","\\'")}')">${installed.has(a.name)?'Added':'Add'}</button></article>`).join('')||'<p style="color:#7183a3">No apps match your search.</p>'}
function appDetails(name){const a=catalog.find(x=>x.name===name);if(!a)return;showWindow('🧩',a.name,`<div class="welcome"><h2>${a.icon} ${a.name}</h2><p>${a.description}. Listed from the community software catalog for discovery. This preview does not download or execute third-party software.</p></div><div class="statrow"><div class="stat"><b>${a.category}</b><small>Category</small></div><div class="stat"><b>${a.source}</b><small>Catalog source</small></div><div class="stat"><b>${installed.has(name)?'Added':'Available'}</b><small>Preview status</small></div></div><p style="color:#7183a3;margin-top:18px">Quantix Store is a prototype catalog. A production distro should use signed packages from trusted repositories, verify signatures, and show license and maintainer details.</p><button class="app-action" style="padding:10px 15px" onclick="installApp('${name.replaceAll("'","\\'")}')">${installed.has(name)?'Remove from preview':'Add to preview'}</button>`)}
function installApp(name){if(installed.has(name)){installed.delete(name);notify(`${name} removed from preview.`)}else{installed.add(name);notify(`${name} added to your preview app list.`)}localStorage.setItem('quantix-installed',JSON.stringify([...installed]));renderApps();if(current==='store')openApp('store')}
function openApp(id){document.getElementById('start').classList.remove('open');if(id==='store'){showWindow('🛍️','Quantix App Store',`<div class="welcome"><h2>Discover your next favorite app</h2><p>${catalog.length} community software listings across ${Object.keys(groups).length} categories. Search, explore, and add apps to this local preview.</p></div><div class="search" style="margin:16px 0"><span>⌕</span><input placeholder="Search the catalog…" oninput="storeFilter(this.value)"></div><div class="tabs" id="store-tabs"></div><p id="store-count" style="color:#8294ad;font-size:12px"></p><div class="apps-grid" id="store-grid"></div>`);renderStore();return}if(id==='welcome'){showWindow('💠','Welcome to Quantix OS',`<div class="welcome"><div class="eyebrow">A community desktop concept</div><h2>Welcome to Quantix OS</h2><p>A friendly blue-and-white Linux desktop concept inspired by Mint’s approachability, CachyOS’s performance focus, and Raspberry Pi OS’s maker spirit.</p></div><div class="statrow"><div class="stat"><b>${catalog.length}+</b><small>App catalog entries</small></div><div class="stat"><b>${Object.keys(groups).length}</b><small>Software categories</small></div><div class="stat"><b>Open</b><small>Built on Linux ideals</small></div></div><h3>Try the desktop</h3><p>Open Files, Notes, Calculator, Settings, Terminal, or browse the app catalog. This repository currently contains a browser-based desktop prototype—not an installable Linux distribution. A real distro needs a kernel, package repositories, installer, hardware support, security updates, and signed release images.</p><button class="app-action" onclick="openApp('store')">Explore App Store</button>`);return}if(id==='files'){showWindow('📁','Files',`<div class="welcome"><h2>Home</h2><p>Demo file manager · Sample folders for the Quantix desktop preview</p></div><div class="files">${[['📁','Documents'],['📁','Downloads'],['🖼️','Pictures'],['🎵','Music'],['🎬','Videos'],['💻','Projects'],['🗑️','Trash']].map(([i,n])=>`<div class="file" onclick="notify('${n} folder · demo view')"><span>${i}</span>${n}</div>`).join('')}</div>`);return}if(id==='notes'){showWindow('📝','Notes',`<div class="welcome" style="margin-bottom:14px"><h2>Quick Notes</h2><p>Notes are saved automatically in this browser.</p></div><textarea class="notes" id="notes" placeholder="Start writing…"></textarea>`);let n=document.getElementById('notes');n.value=localStorage.getItem('quantix-notes')||'';n.oninput=()=>localStorage.setItem('quantix-notes',n.value);return}if(id==='settings'){showWindow('⚙️','Settings',`<div class="welcome"><h2>System Settings</h2><p>Personalize your Quantix desktop preview.</p></div><div class="settings-list" style="margin-top:14px"><div class="setting"><span>🌙 Night light</span><input type="checkbox" onchange="document.getElementById('desktop').style.filter=this.checked?'sepia(.14) brightness(.92)':''"></div><div class="setting"><span>🔤 Interface scale</span><input type="range" min="90" max="115" value="100" oninput="document.body.style.zoom=this.value+'%'"></div><div class="setting"><span>🔔 Desktop notifications</span><input type="checkbox" checked onchange="notify(this.checked?'Notifications enabled':'Notifications muted')"></div><div class="setting"><span>🎨 Accent color</span><input type="color" value="#2878e8" onchange="document.documentElement.style.setProperty('--blue',this.value)"></div><div class="setting"><span>💾 Reset preview data</span><button class="app-action" onclick="if(confirm('Clear saved notes and app list?')){localStorage.clear();location.reload()}">Reset</button></div></div>`);return}if(id==='terminal'){showWindow('⌨️','Terminal',`<div class="terminal" id="term"><div>Quantix Shell Preview · Commands are simulated locally.<br>Try: help, date, apps, neofetch, clear</div><div id="termout"></div><div><span>quantix@desktop:~$ </span><input id="terminput" autofocus></div></div>`);let input=document.getElementById('terminput');input.focus();input.onkeydown=e=>{if(e.key==='Enter'){let v=input.value.trim(),out=document.getElementById('termout');let result={help:'Available preview commands: help · date · apps · neofetch · clear',date:new Date().toString(),apps:`${catalog.length} catalog apps · ${installed.size} added to preview`,neofetch:'Quantix OS Preview\nDesktop: Quantix Blue\nKernel: browser demo (not Linux kernel)',clear:'CLEAR'}[v]||`Command not found in preview: ${v}`;if(v==='clear')out.innerHTML='';else out.innerHTML+=`<div>$ ${v}<br>${result}</div>`;input.value='';document.getElementById('term').scrollTop=9999}};return}if(id==='browser'){showWindow('🌐','Web Browser',`<div class="welcome"><h2>Web Browser</h2><p>This desktop preview does not include a network-enabled browser. In a real Quantix installation, choose and install a browser from trusted, signed repositories.</p></div><div class="statrow"><div class="stat"><b>Privacy first</b><small>No tracking in this demo</small></div><div class="stat"><b>Offline</b><small>Safe local preview</small></div></div>`);return}}
function showWindow(icon,title,html){current=title==='Quantix App Store'?'store':title==='Notes'?'notes':title==='Files'?'files':title==='Settings'?'settings':title==='Terminal'?'terminal':'';document.getElementById('win-icon').textContent=icon;document.getElementById('win-title').textContent=title;document.getElementById('winbody').innerHTML=html;document.getElementById('window').classList.add('open')}
function closeWindow(){document.getElementById('window').classList.remove('open');current=''}function minimizeWindow(){closeWindow()}function maximizeWindow(){let w=document.getElementById('window');w.classList.toggle('maximized');if(w.classList.contains('maximized')){w.style.width='calc(100vw - 28px)';w.style.height='calc(100vh - 120px)';w.style.top='48%'}else{w.style.width='';w.style.height='';w.style.top=''}}
function renderStore(){let q='';const tabs=document.getElementById('store-tabs');if(!tabs)return;tabs.innerHTML=['All',...Object.keys(groups)].map(c=>`<button class="tab ${activeCategory===c?'active':''}" onclick="activeCategory='${c.replaceAll("'","\\'")}';renderStore()">${c}</button>`).join('');let a=catalog.filter(x=>(activeCategory==='All'||x.category===activeCategory)&&(!q||x.name.toLowerCase().includes(q)));document.getElementById('store-count').textContent=`Showing ${a.length} of ${catalog.length} catalog listings`;document.getElementById('store-grid').innerHTML=a.map(x=>`<article class="appcard" onclick="appDetails('${x.name.replaceAll("'","\\'")}')"><span class="appicon">${x.icon}</span><span class="appinfo"><b>${x.name}</b><small>${x.category}</small></span><button class="app-action ${installed.has(x.name)?'installed':''}" onclick="event.stopPropagation();installApp('${x.name.replaceAll("'","\\'")}')">${installed.has(x.name)?'Added':'Add'}</button></article>`).join('')}
function storeFilter(q){const search=document.getElementById('search');if(search){search.value=q;activeCategory='All';renderApps()}const grid=document.getElementById('store-grid');if(!grid)return;let a=catalog.filter(x=>(activeCategory==='All'||x.category===activeCategory)&&`${x.name} ${x.category}`.toLowerCase().includes(q.toLowerCase()));document.getElementById('store-count').textContent=`Showing ${a.length} of ${catalog.length} catalog listings`;grid.innerHTML=a.map(x=>`<article class="appcard" onclick="appDetails('${x.name.replaceAll("'","\\'")}')"><span class="appicon">${x.icon}</span><span class="appinfo"><b>${x.name}</b><small>${x.category}</small></span><button class="app-action ${installed.has(x.name)?'installed':''}" onclick="event.stopPropagation();installApp('${x.name.replaceAll("'","\\'")}')">${installed.has(x.name)?'Added':'Add'}</button></article>`).join('')}
function notify(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2300)}function updateClock(){document.getElementById('clock').textContent=new Intl.DateTimeFormat([], {hour:'numeric',minute:'2-digit'}).format(new Date())}setInterval(updateClock,10000);updateClock();renderApps();document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.getElementById('start').classList.remove('open');closeWindow()}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.getElementById('start').classList.add('open');document.getElementById('search').focus()}});
</script></body></html>
