bundles:
  productivity:
    description: "Optional daily-work applications; not installed in the lightweight base image"
    packages: [thunderbird, libreoffice-impress, gimp, inkscape, filezilla]
  developer:
    description: "Programming and command-line tools"
    packages: [build-essential, jq, ripgrep, fd-find, neovim, python3, python3-pip, nodejs, npm, gdb]
  maker:
    description: "Electronics, coding, and learning tools"
    packages: [thonny, python3-gpiozero, arduino, scratch]
  security-learning:
    description: "Optional defensive auditing and network-visibility tools; use only with authorization"
    packages: [lynis, clamav, ufw, wireshark, tcpdump, nmap]
  gaming:
    description: "Optional gaming tools"
    packages: [lutris, retroarch, gamemode]
  accessibility:
    description: "Optional assistive tools; Orca is included in the base image"
    packages: [onboard, espeak-ng]
