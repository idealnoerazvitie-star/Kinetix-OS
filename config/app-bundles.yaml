bundles:
  productivity:
    description: "Daily desktop work and general productivity"
    packages:
      - firefox-esr
      - thunderbird
      - libreoffice-writer
      - libreoffice-calc
      - libreoffice-impress
      - vlc
      - okular
      - gimp
      - inkscape
      - filezilla
      - keepassxc
  developer:
    description: "Programming and command-line tools"
    packages:
      - git
      - build-essential
      - curl
      - wget
      - jq
      - ripgrep
      - fd-find
      - htop
      - vim
      - neovim
      - python3
      - python3-pip
      - nodejs
      - npm
      - docker.io
      - docker-compose-plugin
      - gdb
  maker:
    description: "Electronics, coding, and learning"
    packages:
      - thonny
      - python3-gpiozero
      - arduino
      - scratch
      - gparted
  security-learning:
    description: "Network and security education"
    packages:
      - nmap
      - wireshark
      - tcpdump
      - aircrack-ng
      - john
      - hashcat
      - binwalk
      - gdb
      - testdisk
      - sqlmap
  gaming:
    description: "Games and entertainment"
    packages:
      - steam
      - lutris
      - retroarch
      - wine
      - gamemode
  accessibility:
    description: "Assistive technology and accessibility"
    packages:
      - orca
      - onboard
      - kdeaccessibility
      - espeak-ng
      - brltty
